<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #070707;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: #111;
      border: 1px solid #222;
      border-radius: 18px;
      padding: 30px;
    }

    h1 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      margin-bottom: 15px;
      background: #080808;
      color: white;
      border: 1px solid #333;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: white;
      color: black;
      font-size: 16px;
      font-weight: bold;
    }

    #status {
      margin-top: 20px;
      color: #aaa;
      line-height: 1.5;
      word-break: break-word;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>Admin Login</h1>

  <input
    id="email"
    type="email"
    placeholder="Email"
  >

  <input
    id="password"
    type="password"
    placeholder="Password"
  >

  <button onclick="login()">
    Login
  </button>

  <div id="status">
    Ready.
  </div>
</div>

<script type="module">

import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://jogogwzfspqtryadusuj.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_gNyURgRCjKgTrrbawUZNkQ_B7vVB-IU";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

window.login = async function () {

  const status = document.getElementById("status");

  status.textContent = "Connecting to Supabase...";

  try {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    if (!email || !password) {
      status.textContent = "Enter your email and password.";
      return;
    }

    status.textContent = "Signing in...";

    const { data, error } =
      await supabase.auth.signInWithPassword({
        email,
        password
      });

    if (error) {
      status.textContent =
        "LOGIN ERROR: " + error.message;
      return;
    }

    if (!data.session) {
      status.textContent =
        "Login succeeded, but no session was created.";
      return;
    }

    status.textContent =
      "Login successful. Checking admin access...";

    const { data: isAdmin, error: adminError } =
      await supabase.rpc("is_admin");

    if (adminError) {
      status.textContent =
        "ADMIN RPC ERROR: " + adminError.message;
      return;
    }

    if (!isAdmin) {

  status.textContent =
    "AUTHENTICATED BUT NOT ADMIN. User ID: " +
    data.user.id;

  return;
}

    status.textContent =
      "Admin verified. Opening dashboard...";

    window.location.href =
      "/admin/dashboard.html";

  } catch (err) {

    status.textContent =
      "JAVASCRIPT ERROR: " + err.message;

    console.error(err);
  }

};

</script>

</body>
</html>
