<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Tansi Cyril</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 20%, rgba(120, 80, 255, 0.16), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(0, 200, 255, 0.10), transparent 35%),
        #07070a;
      color: #fff;
      font-family: Inter, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      padding: 38px 30px;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 24px;
      background: rgba(255,255,255,0.045);
      backdrop-filter: blur(25px);
      box-shadow: 0 30px 100px rgba(0,0,0,0.45);
    }

    .eyebrow {
      color: #999;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    h1 {
      font-size: clamp(34px, 9vw, 48px);
      line-height: 1;
      letter-spacing: -0.04em;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #999;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 15px 16px;
      margin-bottom: 18px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: rgba(255,255,255,0.4);
    }

    button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      background: white;
      color: black;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: transform .2s ease, opacity .2s ease;
    }

    button:active {
      transform: scale(.98);
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      color: #aaa;
    }

    .brand {
      margin-top: 28px;
      text-align: center;
      color: #555;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="login-card">

    <div class="eyebrow">Tansi Cyril · Admin</div>

    <h1>Welcome back.</h1>

    <p class="subtitle">
      Sign in to manage your portfolio, projects, testimonials and website content.
    </p>

    <form id="loginForm">

      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        placeholder="Your admin email"
        autocomplete="email"
        required
      />

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        placeholder="Your password"
        autocomplete="current-password"
        required
      />

      <button id="loginButton" type="submit">
        Sign in
      </button>

    </form>

    <div id="message"></div>

    <div class="brand">
      Growth through better editing.
    </div>

  </main>

  <script type="module">

    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://jogogwzfspqtryadusuj.supabase.coL";
    const SUPABASE_ANON_KEY = "sb_publishable_gNyURgRCjKgTrrbawUZNkQ_B7vVB-IU";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      button.disabled = true;
      button.textContent = "Signing in...";
      message.textContent = "";

      try {

        const { data, error } =
          await supabase.auth.signInWithPassword({
            email,
            password
          });

        if (error) {
          throw error;
        }

        const { data: isAdmin, error: adminError } =
          await supabase.rpc("is_admin");

        if (adminError) {
          throw adminError;
        }

        if (!isAdmin) {

          await supabase.auth.signOut();

          throw new Error(
            "This account is not authorized as an administrator."
          );
        }

        message.textContent = "Login successful. Opening dashboard...";

        window.location.href = "/admin/dashboard.html";

      } catch (error) {

        console.error(error);

        message.textContent =
          error.message || "Something went wrong.";

        button.disabled = false;
        button.textContent = "Sign in";
      }

    });

  </script>

</body>
</html>
