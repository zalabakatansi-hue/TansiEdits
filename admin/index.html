<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login — Tansi Cyril</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #070707;
      color: #f5f5f0;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .login {
      width: 100%;
      max-width: 420px;
    }

    .eyebrow {
      color: #777;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(42px, 12vw, 70px);
      line-height: 0.9;
      letter-spacing: -0.06em;
      margin-bottom: 15px;
    }

    .description {
      color: #888;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 40px;
    }

    label {
      display: block;
      color: #888;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 9px;
    }

    input {
      width: 100%;
      padding: 16px;
      margin-bottom: 20px;
      border: 1px solid #292929;
      background: #101010;
      color: white;
      border-radius: 8px;
      outline: none;
    }

    input:focus {
      border-color: #777;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 8px;
      background: #dfff00;
      color: #000;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    #message {
      margin-top: 18px;
      font-size: 12px;
      line-height: 1.5;
      color: #ff7777;
    }
  </style>
</head>

<body>

  <main class="login">

    <div class="eyebrow">
      Tansi Cyril / Private Area
    </div>

    <h1>
      Welcome<br>
      back.
    </h1>

    <p class="description">
      This area is restricted to the portfolio administrator.
    </p>

    <form id="loginForm">

      <label for="email">
        Email
      </label>

      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="Your admin email"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Your password"
        required
      >

      <button id="loginButton" type="submit">
        Sign in
      </button>

      <div id="message"></div>

    </form>

  </main>


  <script type="module">

    /*
      SUPABASE CONNECTION
      We will add your project's public
      URL and anon key here in the next step.
    */

    const SUPABASE_URL = "https://jogogwzfspqtryadusuj.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_gNyURgRCjKgTrrbawUZNkQ_B7vVB-IU";


    const form =
      document.getElementById("loginForm");

    const button =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");


    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      button.disabled = true;
      button.textContent = "Signing in...";
      message.textContent = "";


      /*
        Supabase authentication will be
        connected here in the next step.
      */

      message.textContent =
        "Supabase connection is not configured yet.";

      button.disabled = false;
      button.textContent = "Sign in";

    });

  </script>

</body>
</html>
