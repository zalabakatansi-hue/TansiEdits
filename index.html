<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin Login — Tansi Cyril</title>

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #080808;
      --panel: #111111;
      --panel-2: #151515;
      --border: rgba(255,255,255,.10);
      --text: #f5f5f5;
      --muted: #8d8d8d;
      --accent: #ffffff;
      --danger: #ff6b6b;
      --success: #70e1a1;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(255,255,255,.07),
          transparent 35%
        ),
        var(--bg);
      color: var(--text);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 430px;
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-mark {
      width: 54px;
      height: 54px;
      margin: 0 auto 16px;
      border: 1px solid var(--border);
      background: #101010;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .brand-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .brand-subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-top: 7px;
    }

    .login-card {
      background: rgba(17,17,17,.92);
      border: 1px solid var(--border);
      padding: 32px;
      box-shadow:
        0 30px 80px rgba(0,0,0,.35);
      backdrop-filter: blur(12px);
    }

    .eyebrow {
      color: #999;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 27px;
      line-height: 1.1;
      letter-spacing: -.04em;
      margin-bottom: 8px;
    }

    .description {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #d9d9d9;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid var(--border);
      outline: none;
      background: #0c0c0c;
      color: white;
      font: inherit;
      font-size: 14px;
      transition:
        border-color .2s,
        background .2s;
    }

    input.password-input {
      padding-right: 76px;
    }

    input:focus {
      border-color: rgba(255,255,255,.35);
      background: #101010;
    }

    input::placeholder {
      color: #555;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #888;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      padding: 5px;
    }

    .toggle-password:hover {
      color: white;
    }

    .login-button {
      width: 100%;
      height: 50px;
      margin-top: 6px;
      border: 0;
      background: white;
      color: black;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .04em;
      transition:
        opacity .2s,
        transform .2s;
    }

    .login-button:hover {
      opacity: .9;
    }

    .login-button:active {
      transform: scale(.99);
    }

    .login-button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,.08);
      background: #0d0d0d;
      font-size: 12px;
      line-height: 1.5;
    }

    .message.show {
      display: block;
    }

    .message.error {
      color: var(--danger);
      border-color: rgba(255,107,107,.18);
    }

    .message.success {
      color: var(--success);
      border-color: rgba(112,225,161,.18);
    }

    .footer {
      text-align: center;
      color: #555;
      font-size: 11px;
      margin-top: 22px;
    }

    @media (max-width: 480px) {
      body {
        padding: 18px;
      }

      .login-card {
        padding: 25px 20px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <main class="login-wrapper">

    <div class="brand">

      <div class="brand-mark">
        TC
      </div>

      <div class="brand-title">
        Tansi Cyril
      </div>

      <div class="brand-subtitle">
        Portfolio Administration
      </div>

    </div>


    <section class="login-card">

      <div class="eyebrow">
        Private area
      </div>

      <h1>
        Welcome back.
      </h1>

      <p class="description">
        Sign in to manage your projects, testimonials and portfolio content.
      </p>


      <form id="loginForm">

        <div class="field">

          <label for="email">
            Email
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >

        </div>


        <div class="field">

          <label for="password">
            Password
          </label>

          <div class="input-wrap">

            <input
              type="password"
              id="password"
              name="password"
              class="password-input"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="toggle-password"
              id="togglePassword"
            >
              Show
            </button>

          </div>

        </div>


        <button
          type="submit"
          class="login-button"
          id="loginButton"
        >
          Sign in
        </button>

      </form>


      <div
        class="message"
        id="message"
      ></div>

    </section>


    <div class="footer">
      Tansi Cyril © 2026
    </div>

  </main>


  <script type="module">

    import {
      createClient
    } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    /*
      SUPABASE CONFIG
    */

    const SUPABASE_URL =
      "https://jogogwzfspqtryadusuj.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_gNyURgRCjKgTrrbawUZNkQ_B7vVB-IU";


    const supabase =
      createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    /*
      ELEMENTS
    */

    const loginForm =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");

    const togglePassword =
      document.getElementById("togglePassword");


    /*
      SHOW MESSAGE
    */

    function showMessage(
      text,
      type = "error"
    ) {

      message.textContent = text;

      message.className =
        "message show " + type;

    }


    /*
      HIDE MESSAGE
    */

    function hideMessage() {

      message.textContent = "";

      message.className =
        "message";

    }


    /*
      PASSWORD VISIBILITY
    */

    togglePassword.addEventListener(
      "click",
      () => {

        const isPassword =
          passwordInput.type === "password";

        passwordInput.type =
          isPassword
            ? "text"
            : "password";

        togglePassword.textContent =
          isPassword
            ? "Hide"
            : "Show";

      }
    );


    /*
      CHECK IF CURRENT USER IS ADMIN
    */

    async function checkAdmin() {

      try {

        const {
          data: {
            session
          }
        } =
          await supabase.auth.getSession();


        if (!session) {
          return false;
        }


        const {
          data,
          error
        } =
          await supabase.rpc("is_admin");


        if (error) {

          console.error(
            "Admin check failed:",
            error
          );

          return false;

        }


        return data === true;

      } catch (error) {

        console.error(
          "Admin check error:",
          error
        );

        return false;

      }

    }


    /*
      CHECK EXISTING SESSION
    */

    async function checkExistingSession() {

      const {
        data: {
          session
        }
      } =
        await supabase.auth.getSession();


      if (!session) {
        return;
      }


      const isAdmin =
        await checkAdmin();


      if (isAdmin) {

        window.location.href =
          "/admin/dashboard.html";

        return;

      }


      /*
        Logged in but not an admin.
        Sign them out so they cannot remain
        inside the admin session.
      */

      await supabase.auth.signOut();

    }


    /*
      LOGIN
    */

    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        hideMessage();


        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (!email || !password) {

          showMessage(
            "Please enter your email and password."
          );

          return;

        }


        loginButton.disabled = true;

        loginButton.textContent =
          "Signing in...";


        try {

          const {
            data,
            error
          } =
            await supabase.auth.signInWithPassword({
              email,
              password
            });


          if (error) {

            console.error(
              "Login error:",
              error
            );

            showMessage(
              "Invalid email or password."
            );

            return;

          }


          if (!data.session) {

            showMessage(
              "Login could not be completed. Please try again."
            );

            return;

          }


          /*
            Verify that the authenticated
            account actually has admin access.
          */

          const {
            data: adminData,
            error: adminError
          } =
            await supabase.rpc("is_admin");


          if (adminError) {

            console.error(
              "Admin verification error:",
              adminError
            );

            await supabase.auth.signOut();

            showMessage(
              "Admin verification failed. Please try again."
            );

            return;

          }


          if (adminData !== true) {

            await supabase.auth.signOut();

            showMessage(
              "This account is not authorized to access the admin dashboard."
            );

            return;

          }


          showMessage(
            "Login successful. Opening dashboard...",
            "success"
          );


          setTimeout(
            () => {

              window.location.href =
                "/admin/dashboard.html";

            },
            400
          );


        } catch (error) {

          console.error(
            "Unexpected login error:",
            error
          );

          showMessage(
            "Something went wrong. Please try again."
          );

        } finally {

          loginButton.disabled = false;

          loginButton.textContent =
            "Sign in";

        }

      }
    );


    /*
      START
    */

    checkExistingSession();

  </script>

</body>
</html>
